name: Purge jsDelivr cache

# jsDelivr caches @main files for hours, so a committed CSV edit is invisible until purged.
# Branch pushes: purge the changed data/ and dist/ files at @main.
# Release tags (v*): purge the @1 alias so it re-resolves to the newest v1.x.x tag.
# (GitHub ignores the paths filter for tag pushes, so tags always run.)
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["data/**", "dist/**"]
  workflow_dispatch:

concurrency:
  group: purge-jsdelivr
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which files to purge
        id: files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            major=$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1)
            files=$(git ls-files dist)
            ref="$major"
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # New branch, manual run or force-push: purge everything we serve.
            files=$(git ls-files data dist)
            ref="main"
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- data dist)
            ref="main"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          { echo "list<<EOF"; echo "$files"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Purge
        env:
          REF: ${{ steps.files.outputs.ref }}
          FILES: ${{ steps.files.outputs.list }}
        run: |
          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${REF}/${f}"
            echo "Purging $url"
            curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$url" || status=1
            echo
            # jsDelivr rate-limits purge requests; space them out.
            sleep 3
          done <<< "$FILES"
          exit $status
